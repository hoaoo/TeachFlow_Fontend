name: Release TeachFlow Desktop

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app (production)
        env:
          NEXT_PUBLIC_API_URL: https://hoan-dev081202.onrender.com
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $pubdate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.000Z")
          $msiPath = "src-tauri/target/release/bundle/msi/TeachFlow_${version}_x64_en-US.msi"
          $nsisPath = "src-tauri/target/release/bundle/nsis/TeachFlow_${version}_x64-setup.exe"
          $msiSig = Get-Content "${msiPath}.sig" -Raw
          $nsisSig = Get-Content "${nsisPath}.sig" -Raw
          $msiSig = $msiSig.Trim()
          $nsisSig = $nsisSig.Trim()
          $json = @{
            version = $version
            notes = "TeachFlow $version"
            pub_date = $pubdate
            platforms = @{
              "windows-x86_64" = @{
                signature = $nsisSig
                url = "https://github.com/hoaoo/TeachFlow_Fontend/releases/download/v${version}/TeachFlow_${version}_x64-setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "latest.json" -Value $json -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content "latest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TeachFlow v${{ steps.version.outputs.VERSION }}"
          body: |
            ## TeachFlow Desktop v${{ steps.version.outputs.VERSION }}

            ### Cài đặt
            - **Windows (NSIS)**: Tải `TeachFlow_${{ steps.version.outputs.VERSION }}_x64-setup.exe`
            - **Windows (MSI)**: Tải `TeachFlow_${{ steps.version.outputs.VERSION }}_x64_en-US.msi`

            ### Cập nhật tự động
            Nếu bạn đã cài TeachFlow, ứng dụng sẽ tự động phát hiện và đề nghị cập nhật.
          files: |
            src-tauri/target/release/bundle/msi/TeachFlow_${{ steps.version.outputs.VERSION }}_x64_en-US.msi
            src-tauri/target/release/bundle/msi/TeachFlow_${{ steps.version.outputs.VERSION }}_x64_en-US.msi.sig
            src-tauri/target/release/bundle/nsis/TeachFlow_${{ steps.version.outputs.VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/TeachFlow_${{ steps.version.outputs.VERSION }}_x64-setup.exe.sig
            latest.json
          draft: false
          prerelease: false