name: Release TeachFlow Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Check version synchronization
        run: npm run release:check

      - name: Prepare Tauri signing credentials
        env:
          SECRET_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          SECRET_TAURI_KEY: ${{ secrets.TAURI_KEY }}
          SECRET_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SECRET_UPDATER_KEY: ${{ secrets.UPDATER_KEY }}
          SECRET_TAURI_UPDATER_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
          SECRET_TAURI_UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          SECRET_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SECRET_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SECRET_TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          SECRET_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SECRET_UPDATER_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
        run: node scripts/prepare-signing-key.mjs

      - name: Build Tauri Desktop (Signed)
        env:
          NEXT_PUBLIC_API_URL: https://hoan-dev081202.onrender.com
          TAURI_SIGNING_PRIVATE_KEY_PATH: src-tauri/tauri.key
          TAURI_PRIVATE_KEY_PATH: src-tauri/tauri.key
        run: npx tauri build

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate latest.json updater manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $pubdate = (Get-Date -Format "yyyy-MM-ddTHH:mm:ss.000Z")
          $nsisPath = "src-tauri/target/release/bundle/nsis/TeachFlow_${version}_x64-setup.exe"
          $nsisSigPath = "${nsisPath}.sig"
          
          if (-not (Test-Path $nsisSigPath)) {
            Write-Error "Signature file $nsisSigPath not found!"
            exit 1
          }
          
          $nsisSig = (Get-Content $nsisSigPath -Raw).Trim()
          $json = @{
            version = $version
            notes = "TeachFlow Desktop $version: Bo sung hien thi version runtime, nang cap Resource & File Viewer V2, HTTP Range Streaming, va mo ung dung mac dinh tren Windows."
            pub_date = $pubdate
            platforms = @{
              "windows-x86_64" = @{
                signature = $nsisSig
                url = "https://github.com/hoaoo/TeachFlow_Fontend/releases/download/v${version}/TeachFlow_${version}_x64-setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "latest.json" -Value $json -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content "latest.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TeachFlow v${{ steps.version.outputs.VERSION }}"
          body: |
            ## TeachFlow Desktop v${{ steps.version.outputs.VERSION }}

            ### Cài đặt
            - Tải installer: `TeachFlow_${{ steps.version.outputs.VERSION }}_x64-setup.exe`

            ### Cập nhật tự động (In-App Auto Updater)
            Ứng dụng TeachFlow đã cài đặt sẽ tự động nhận diện và cập nhật lên phiên bản này qua Tauri Updater.
          files: |
            src-tauri/target/release/bundle/nsis/TeachFlow_${{ steps.version.outputs.VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/TeachFlow_${{ steps.version.outputs.VERSION }}_x64-setup.exe.sig
            latest.json
          draft: false
          prerelease: false